// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        // react-native-webgpu（3D地形の描画基盤）がAHardwareBuffer APIを使うため26以上が必須。
        // WebGPUのバックエンドであるVulkanも実質Android 8.0以降の前提
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36

        // We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"

        // react-native-background-geolocation
        appCompatVersion = "1.4.2"
        googlePlayServicesLocationVersion = "21.0.1"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.android.libraries.mapsplatform.secrets-gradle-plugin:secrets-gradle-plugin:2.0.1")
        classpath 'com.google.gms:google-services:4.4.3'
        classpath("com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.1.20-1.0.32")
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        maven { url("${rootProject.projectDir}/../node_modules/react-native-background-geolocation/android/libs") }
        maven { url("${rootProject.projectDir}/../node_modules/react-native-background-fetch/android/libs") }
        // NDK r28cでリビルドした16KBページ対応のVirgilネイティブライブラリ (maven-virgil/README.md参照)
        maven { url("${rootProject.projectDir}/maven-virgil") }
    }
    configurations.all {
        resolutionStrategy.dependencySubstitution {
            substitute(module('com.virgilsecurity.crypto:foundation-android'))
                .using(module('com.virgilsecurity.crypto:foundation-android:0.13.1-16kb'))
                .because('16KB page size support (rebuilt with NDK r28c)')
            substitute(module('com.virgilsecurity.crypto:pythia-android'))
                .using(module('com.virgilsecurity.crypto:pythia-android:0.13.1-16kb'))
                .because('16KB page size support (rebuilt with NDK r28c)')
        }
    }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
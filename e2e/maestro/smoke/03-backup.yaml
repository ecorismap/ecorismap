# SET-3（一部）: 設定の「バックアップから復元」で、自動バックアップの一覧が開く。データは変えない。
# クリア→復元の通し（SET-2・SET-3）は端末のデータを消すので、90-clear-restore.yaml に分けてある
# （scripts/e2e-native.sh は、名前を指定したときか E2E_ALLOW_CLEAR=1 のときだけ90番台を流す）。
appId: jp.co.ecoris.ecorismap
---
- runFlow: ../common/launch.yaml
- runFlow: ../common/open-settings.yaml
- tapOn:
    id: 'settings-backup-restore'
- extendedWaitUntil:
    visible:
      id: 'settings-backup-cancel'
    timeout: 10000
- takeScreenshot: 03-backup-list
- tapOn:
    id: 'settings-backup-cancel'
- assertVisible:
    id: 'settings-backup-restore'

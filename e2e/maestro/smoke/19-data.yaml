# DATA-2（日時・リスト・ラジオ・チェック）・DATA-11・DATA-9・DATA-10: データ編集の入力（ネイティブ固有の部品を通る経路）。
# - DATA-2: 日時の欄を押すとOSの日付ピッカーが開き、Cancel なら変わらず、ホイールを回して OK すると日付が変わる。
#   リストは選択肢の一覧から選べ、ラジオは1つだけ選ばれ、チェックは複数選べて外せる。保存するとデータ一覧にその値が出て、
#   開き直しても同じ値・同じ印になっている（数値・範囲・辞書・テーブル・参照の欄は確かめていない）
# - DATA-11: 変更したまま戻ろうとすると「変更を破棄しますか？」と出る。No なら編集中のまま、Yes なら変更が捨てられて一覧に戻る
# - DATA-9: 複製すると確認と「コピーしました。」が出て、同じ値の2件目（2/2）が開く。前へ・次へで 1/2・2/2 を行き来できる
# - DATA-10: 「位置」で位置を付けた記録を、地図を離れた場所へ動かしてから「表示」すると、地図がその記録の位置へ移る
#   （画面中央付近の長押しの座標が、記録の座標の近くになる）
# 項目のあるテスト用のレイヤ e2edata（日時 dt・リスト li・ラジオ ra・チェック ch・文字列 cmt）をレイヤ設定の画面で作り、最後に消す
# （前回の途中で残っていれば最初に消す）。記録を追加するときに編集レイヤが e2edata に切り替わるので、最後に「ポイント」へ戻す。
# 項目名・選択肢は半角英数字（端末の日本語入力が変換してしまうため）。
appId: jp.co.ecoris.ecorismap
env:
  LAYER_NAME: 'e2edata.*'
  EDIT_LAYER: 'ポイント'
# 途中で失敗しても、編集レイヤは「ポイント」へ戻す（テスト用のレイヤは、次に流したときの最初に消す）
onFlowComplete:
  - runFlow: ../common/launch.yaml
  - runFlow:
      file: ../common/select-feature.yaml
      env:
        FEATURE: point
  - runFlow: ../common/set-editing-layer.yaml
  - runFlow:
      file: ../common/select-feature.yaml
      env:
        FEATURE: draw
---
- runFlow: ../common/launch.yaml
- runFlow: ../common/discard-interrupted-track.yaml
# 起動直後（地図の読み込み中）のタップは効かないことがあるので、一覧が開くまで押し直す
- repeat:
    while:
      notVisible:
        id: 'layers-add'
    times: 5
    commands:
      - tapOn:
          id: 'home-layers'
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 3000
# いまあるレイヤの数（＝作るレイヤの行番号）を数える。前回の残りが末尾にあれば消す
- runFlow: ../common/count-layers.yaml
- evalScript: ${output.layerIndex = output.layerCount - 1}
- repeat:
    while:
      visible:
        id: layers-row-${output.layerIndex}
        text: ${LAYER_NAME}
    times: 3
    commands:
      - runFlow: ../common/delete-layer-at.yaml
      - evalScript: ${output.layerCount = output.layerCount - 1}
      - evalScript: ${output.layerIndex = output.layerCount - 1}
      - repeat:
          times: 6
          commands:
            - swipe:
                start: '50%,75%'
                end: '50%,25%'
                duration: 400
      - waitForAnimationToEnd:
          timeout: 3000
- evalScript: ${output.layerIndex = output.layerCount}

# テスト用のレイヤを作る
- tapOn:
    id: 'layers-add'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'layeredit-name'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'layeredit-name'
- inputText: 'e2edata'
- pressKey: Enter
- assertVisible:
    id: 'layeredit-type'
    text: 'ポイント.*'
# 日時の項目
- tapOn:
    id: 'layeredit-field-add'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'layeredit-field-name-0'
    timeout: 10000
- tapOn:
    id: 'layeredit-field-name-0'
- inputText: 'dt'
- pressKey: Enter
- tapOn:
    id: 'layeredit-field-format-0'
    retryTapIfNoChange: false
- tapOn: '日時'
- extendedWaitUntil:
    visible:
      id: 'layeredit-field-format-0'
      text: '日時.*'
    timeout: 10000
# リスト・ラジオ・チェックの項目（選択肢を2つずつ）
- runFlow:
    file: ../common/add-choice-field.yaml
    env:
      FIELD_INDEX: 1
      FIELD_NAME: 'li'
      FIELD_FORMAT: 'リスト'
      VALUE_1: 'a1'
      VALUE_2: 'a2'
- runFlow:
    file: ../common/add-choice-field.yaml
    env:
      FIELD_INDEX: 2
      FIELD_NAME: 'ra'
      FIELD_FORMAT: 'ラジオボタン'
      VALUE_1: 'r1'
      VALUE_2: 'r2'
- runFlow:
    file: ../common/add-choice-field.yaml
    env:
      FIELD_INDEX: 3
      FIELD_NAME: 'ch'
      FIELD_FORMAT: 'チェックボタン'
      VALUE_1: 'c1'
      VALUE_2: 'c2'
# 文字列の項目（データ形式は既定のまま）
- tapOn:
    id: 'layeredit-field-add'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'layeredit-field-name-4'
    timeout: 10000
- tapOn:
    id: 'layeredit-field-name-4'
- inputText: 'cmt'
- pressKey: Enter
- tapOn:
    id: 'layeredit-save'
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'sheet-back'
- extendedWaitUntil:
    visible:
      id: 'layers-add'
    timeout: 10000
# 一覧の末尾にできている（画面の下にあるので、末尾まで送る）
- repeat:
    times: 6
    commands:
      - swipe:
          start: '50%,75%'
          end: '50%,25%'
          duration: 400
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: layers-row-${output.layerIndex}
    text: ${LAYER_NAME}
- tapOn:
    id: layers-row-${output.layerIndex}
- extendedWaitUntil:
    visible:
      id: 'data-add'
    timeout: 10000
- assertNotVisible:
    id: 'data-row-0'

# 記録を追加する。編集レイヤになっていないので、切り替えの確認が出る（Yesで切り替わるだけなので、追加を押し直す）
- repeat:
    while:
      notVisible:
        id: 'dataedit-input-dt'
    times: 3
    commands:
      - tapOn:
          id: 'data-add'
          retryTapIfNoChange: false
      - extendedWaitUntil:
          visible:
            id: 'dialog-message'
          timeout: 3000
          optional: true
      - runFlow:
          when:
            visible:
              id: 'dialog-message'
          commands:
            - assertVisible: '.*編集モードに切り替えますか.*'
            - tapOn: 'Yes'
            - waitForAnimationToEnd:
                timeout: 3000
- extendedWaitUntil:
    visible:
      id: 'dataedit-input-dt'
    timeout: 10000
- waitForAnimationToEnd
# 既定値: 日時はいま、リストは先頭、ラジオは先頭に印（印あり 󰄴・なし 󰄰）、チェックは空（空 󰄱・入り 󰄵）
- assertVisible:
    id: 'dataedit-input-dt'
    text: 'dt, \d{4}/\d{2}/\d{2} \d{2}:\d{2}'
- assertVisible:
    id: 'dataedit-input-li'
    text: 'a1.*'
- assertVisible:
    id: 'dataedit-option-ra-0'
    text: '󰄴'
- assertVisible:
    id: 'dataedit-option-ra-1'
    text: '󰄰'
- assertVisible:
    id: 'dataedit-option-ch-0'
    text: '󰄱'
- copyTextFrom:
    id: 'dataedit-input-dt'
- evalScript: ${output.dt0 = maestro.copiedText}

# DATA-2 日時: OSの日付ピッカー。ホイールを回して Cancel なら変わらない
- tapOn:
    id: 'dataedit-input-dt'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: 'Cancel'
    timeout: 10000
- assertVisible: 'OK'
- takeScreenshot: 19-data-datepicker
- swipe:
    start: '36%,68%'
    end: '36%,76%'
    duration: 800
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: 'Cancel'
- extendedWaitUntil:
    notVisible: 'Cancel'
    timeout: 10000
- assertVisible:
    id: 'dataedit-input-dt'
    text: ${output.dt0}
# ホイール（日付の列）を回して OK すると、日付が変わる
- tapOn:
    id: 'dataedit-input-dt'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: 'Cancel'
    timeout: 10000
- swipe:
    start: '36%,68%'
    end: '36%,76%'
    duration: 800
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: 'OK'
- extendedWaitUntil:
    notVisible: 'Cancel'
    timeout: 10000
- assertVisible:
    id: 'dataedit-input-dt'
    text: 'dt, \d{4}/\d{2}/\d{2} \d{2}:\d{2}'
- copyTextFrom:
    id: 'dataedit-input-dt'
- evalScript: ${output.dt1 = maestro.copiedText}
# 日付の部分（年月日）が変わっている
- assertTrue: ${output.dt1.slice(0, 14) !== output.dt0.slice(0, 14)}

# DATA-2 リスト: 押すと選択肢の一覧が開き、選ぶと欄に入る
- tapOn:
    id: 'dataedit-input-li'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'dataedit-option-li-1'
    timeout: 10000
- assertVisible:
    id: 'dataedit-option-li-0'
- tapOn:
    id: 'dataedit-option-li-1'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'dataedit-input-li'
      text: 'a2.*'
    timeout: 10000
# DATA-2 ラジオ: 2つ目を選ぶと、1つ目の印が外れる
- tapOn:
    id: 'dataedit-option-ra-1'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'dataedit-option-ra-1'
      text: '󰄴'
    timeout: 10000
- assertVisible:
    id: 'dataedit-option-ra-0'
    text: '󰄰'
# DATA-2 チェック: 両方に入れられ、押し直すと外れる
- tapOn:
    id: 'dataedit-option-ch-0'
    retryTapIfNoChange: false
- tapOn:
    id: 'dataedit-option-ch-1'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'dataedit-option-ch-1'
      text: '󰄵'
    timeout: 10000
- assertVisible:
    id: 'dataedit-option-ch-0'
    text: '󰄵'
- tapOn:
    id: 'dataedit-option-ch-0'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'dataedit-option-ch-0'
      text: '󰄱'
    timeout: 10000
- takeScreenshot: 19-data-inputs
# 保存すると、データ一覧にその値が出る（列は dt・li・ra・ch・cmt の順）
- tapOn:
    id: 'dataedit-save'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'data-row-0'
    timeout: 10000
- assertVisible:
    id: 'data-row-0'
    text: ${output.dt1.replace('dt, ', '')}
- assertVisible:
    id: 'data-cell-0-1'
    text: 'a2'
- assertVisible:
    id: 'data-cell-0-2'
    text: 'r2'
- assertNotVisible:
    id: 'data-row-1'
# （チェックの列は右にはみ出していて描かれていないので、表を横にずらして確かめ、戻す）
- swipe:
    start: '80%,25%'
    end: '20%,25%'
    duration: 600
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: 'data-cell-0-3'
    text: 'c2'
- swipe:
    start: '20%,25%'
    end: '80%,25%'
    duration: 600
- waitForAnimationToEnd:
    timeout: 2000
# 開き直しても同じ値・同じ印
- tapOn:
    id: 'data-row-0'
- extendedWaitUntil:
    visible:
      id: 'dataedit-input-dt'
      text: ${output.dt1}
    timeout: 10000
- waitForAnimationToEnd
- assertVisible:
    id: 'dataedit-input-li'
    text: 'a2.*'
- assertVisible:
    id: 'dataedit-option-ra-1'
    text: '󰄴'
- assertVisible:
    id: 'dataedit-option-ch-0'
    text: '󰄱'
- assertVisible:
    id: 'dataedit-option-ch-1'
    text: '󰄵'

# DATA-11: 変更したまま（ラジオを1つ目に変えて）戻ろうとすると、破棄の確認が出る
- tapOn:
    id: 'dataedit-option-ra-0'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'dataedit-option-ra-0'
      text: '󰄴'
    timeout: 10000
- tapOn:
    id: 'sheet-back'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'dialog-message'
      text: '変更を破棄しますか？'
    timeout: 10000
# No なら編集中のまま（変更も残っている）
- tapOn: 'No'
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: 'dataedit-option-ra-0'
    text: '󰄴'
- assertNotVisible:
    id: 'data-add'
# Yes なら変更が捨てられて一覧に戻る（ラジオの列は保存済みの r2 のまま）
- tapOn:
    id: 'sheet-back'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'dialog-message'
      text: '変更を破棄しますか？'
    timeout: 10000
- tapOn: 'Yes'
- extendedWaitUntil:
    visible:
      id: 'data-add'
    timeout: 10000
- assertVisible:
    id: 'data-cell-0-2'
    text: 'r2'

# DATA-9: 複製すると、同じ値の2件目が開く
- tapOn:
    id: 'data-row-0'
- extendedWaitUntil:
    visible:
      id: 'dataedit-copy'
    timeout: 10000
- waitForAnimationToEnd
- assertVisible:
    id: 'dataedit-record-number'
    text: '1/1'
- tapOn:
    id: 'dataedit-copy'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'dialog-message'
      text: 'データをコピーしますか？'
    timeout: 10000
- tapOn: 'Yes'
- extendedWaitUntil:
    visible:
      id: 'dialog-message'
      text: 'コピーしました。'
    timeout: 10000
- tapOn: 'OK'
- extendedWaitUntil:
    visible:
      id: 'dataedit-record-number'
      text: '2/2'
    timeout: 10000
- assertVisible:
    id: 'dataedit-input-li'
    text: 'a2.*'
- assertVisible:
    id: 'dataedit-option-ra-1'
    text: '󰄴'
- assertVisible:
    id: 'dataedit-option-ch-1'
    text: '󰄵'
# 前へ・次へ
- tapOn:
    id: 'dataedit-prev'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'dataedit-record-number'
      text: '1/2'
    timeout: 10000
- tapOn:
    id: 'dataedit-next'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'dataedit-record-number'
      text: '2/2'
    timeout: 10000

# DATA-10: 2件目に「位置」で位置を付ける（地図を押して確定する）
- tapOn:
    id: 'dataedit-edit-position'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'home-draw-finish-edit-position'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    point: '50%,35%'
- extendedWaitUntil:
    visible:
      id: 'home-draw-save'
    timeout: 10000
- tapOn:
    id: 'home-draw-save'
    retryTapIfNoChange: false
- extendedWaitUntil:
    notVisible:
      id: 'home-draw-finish-edit-position'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'home-layers'
    timeout: 10000
# 位置編集を終えると、記録の編集画面のシートが開き直る（開いていないこともあるので、開くまでレイヤのボタンを押す）。位置が入っている
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    while:
      notVisible:
        id: 'sheet-close'
    times: 3
    commands:
      - tapOn:
          id: 'home-layers'
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 3000
- assertVisible:
    id: 'dataedit-jump'
- assertVisible:
    id: 'dataedit-record-number'
    text: '2/2'
- copyTextFrom:
    id: 'dataedit-coords-latitude-decimal'
- evalScript: ${output.recLat = Number(maestro.copiedText)}
- copyTextFrom:
    id: 'dataedit-coords-longitude-decimal'
- evalScript: ${output.recLon = Number(maestro.copiedText)}
- assertTrue: ${output.recLat > 20 && output.recLat < 50 && output.recLon > 120 && output.recLon < 155}
- runFlow: ../common/close-sheet.yaml
# 位置編集のあとは作図の種類が「ポイント」になっている。選択なしへ戻す
# （シートが開いているあいだは、下部のボタンがシートのボタンと重なる。シートを閉じてから押す）
- runFlow:
    file: ../common/select-feature.yaml
    env:
      FEATURE: draw
# 地図を記録から離れた場所へ動かす（下へドラッグして、画面中央付近の長押しの座標が記録から0.05度以上離れるまで）
- evalScript: ${output.away = [output.recLat, output.recLon]}
- repeat:
    while:
      true: ${Math.abs(output.away[0] - output.recLat) <= 0.05}
    times: 6
    commands:
      - swipe:
          start: '70%,30%'
          end: '70%,70%'
          duration: 800
      - waitForAnimationToEnd:
          timeout: 3000
      - longPressOn:
          point: '50%,60%'
      - extendedWaitUntil:
          visible:
            id: 'home-poi-coordinate'
          timeout: 10000
      - copyTextFrom:
          id: 'home-poi-coordinate'
      - evalScript: ${output.away = maestro.copiedText.split(',').map(Number)}
- evalScript: ${console.log('DATA-10 record ' + output.recLat + ',' + output.recLon + ' away ' + output.away)}
- assertTrue: ${Math.abs(output.away[0] - output.recLat) > 0.05}
# 「表示」を押すと、地図が記録の位置へ移る（レイヤのボタンは、開いていた記録の編集画面を開き直す）
- repeat:
    while:
      notVisible:
        id: 'sheet-close'
    times: 3
    commands:
      - tapOn:
          id: 'home-layers'
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 3000
- assertVisible:
    id: 'dataedit-record-number'
    text: '2/2'
- tapOn:
    id: 'dataedit-jump'
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: ../common/close-sheet.yaml
- takeScreenshot: 19-data-jumped
- longPressOn:
    point: '50%,60%'
- extendedWaitUntil:
    visible:
      id: 'home-poi-coordinate'
    timeout: 10000
- copyTextFrom:
    id: 'home-poi-coordinate'
- evalScript: ${output.near = maestro.copiedText.split(',').map(Number)}
- evalScript: ${console.log('DATA-10 record ' + output.recLat + ',' + output.recLon + ' away ' + output.away + ' near ' + output.near)}
- assertTrue: ${Math.abs(output.near[0] - output.recLat) < 0.03 && Math.abs(output.near[1] - output.recLon) < 0.03}

# 後片付け: テスト用のレイヤを消す（記録も一緒に消える）
- runFlow: ../common/launch.yaml
- repeat:
    while:
      notVisible:
        id: 'layers-add'
    times: 5
    commands:
      - tapOn:
          id: 'home-layers'
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow: ../common/delete-layer-at.yaml
- assertNotVisible:
    id: layers-row-${output.layerIndex}
- runFlow: ../common/close-sheet.yaml
# 編集レイヤを「ポイント」へ戻すのは、終了時の処理（onFlowComplete）で行う

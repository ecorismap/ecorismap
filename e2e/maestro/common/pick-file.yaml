# 開いているOSのファイル選択で、テスト用のファイル ${FILE}（名前。拡張子つき）を選ぶ。
# ファイルは scripts/e2e-native.sh が流す前に、端末の「ファイル」アプリの「このiPhone内」（Androidは Download フォルダ）へ置く。
# - iOS: ファイル選択は最後に開いた場所を開く。どこが開いても、検索して探す。
#   ファイルの枠は、名前・種類・日付・サイズをまとめた読み上げ文言（「e2e_x.geojson, geojson, …」）で指定する
# - Android: 「最近使用したファイル」などが開く。そこに出ていなければ、左上のメニューから「ダウンロード」へ移り、下へ送って探して選ぶ
#   （検索は端末の日本語入力が文字を変換するので使わない）
appId: jp.co.ecoris.ecorismap
---
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'ブラウズ'
          timeout: 15000
      - waitForAnimationToEnd:
          timeout: 3000
      # 「ファイル」が知っている種類（csv・pdf など）は、名前に拡張子が付かない（「e2e_x, csv, …」）
      - evalScript: ${output.pickLabel = FILE.slice(0, FILE.lastIndexOf('.')) + '([.]' + FILE.slice(FILE.lastIndexOf('.') + 1) + ')?, .*'}
      # 画面の外にあるファイルも「見えている」と判定され、押しても選べない。毎回、検索して画面内に出してから押す
      - tapOn: '検索'
      - inputText: ${FILE}
      - extendedWaitUntil:
          visible: ${output.pickLabel}
          timeout: 15000
      - hideKeyboard
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: ${output.pickLabel}
          retryTapIfNoChange: false
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: 'com.google.android.documentsui:id/toolbar'
          timeout: 15000
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            notVisible: ${FILE}
          commands:
            - tapOn: 'ルートを表示する'
            - tapOn:
                id: 'android:id/title'
                text: 'ダウンロード'
            - waitForAnimationToEnd:
                timeout: 3000
            # ダウンロードはファイルが多く、画面の外のファイルは描かれていない。出るまで下へ送る
            - scrollUntilVisible:
                element:
                  id: 'android:id/title'
                  text: ${FILE}
                direction: DOWN
                timeout: 60000
                visibilityPercentage: 100
      - tapOn:
          id: 'android:id/title'
          text: ${FILE}
          retryTapIfNoChange: false

# アプリを起動し直して、地図画面が使える状態にする。
# 初回起動のダイアログ（利用規約・更新情報）と開発ビルドの警告トーストは、出ていれば閉じる。
appId: jp.co.ecoris.ecorismap
---
- stopApp
- launchApp:
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: 'home-layers'
    timeout: 120000
- runFlow:
    when:
      visible: '利用規約に同意して開始しますか？'
    commands:
      - tapOn: 'OK'
- runFlow:
    when:
      visible: '更新情報'
    commands:
      - tapOn: 'OK'
# 開発ビルドの警告トーストは下部のボタンに重なり、起動後に遅れて何度か出る。出なくなるまで閉じる
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    while:
      visible: 'Open debugger to view warnings.'
    times: 5
    commands:
      # Androidは、トーストの×が見つからない瞬間に「右にある要素」が地図上のマーカーやシートの×になり、
      # 記録の編集画面を開いてしまうことがある。トーストの中の要素だけを押す（見つからなければ押さない）
      - runFlow:
          when:
            platform: Android
          commands:
            - tapOn:
                rightOf: 'Open debugger to view warnings.'
                childOf:
                  text: '!, Open debugger to view warnings.'
                retryTapIfNoChange: false
                optional: true
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                rightOf: 'Open debugger to view warnings.'
                retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 2000

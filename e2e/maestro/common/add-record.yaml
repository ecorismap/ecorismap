# 開いているデータ一覧（編集できるレイヤ）に、テスト用の記録を1件追加して保存する。
# 先に count-rows.yaml で output.row（＝追加される行の番号）を数えておくこと。
appId: jp.co.ecoris.ecorismap
---
# 編集レイヤになっていないときは、切り替えの確認が出る（Yesで切り替わるだけなので、追加を押し直す）
- repeat:
    while:
      notVisible:
        id: 'dataedit-input-cmt'
    times: 3
    commands:
      - tapOn:
          id: 'data-add'
          retryTapIfNoChange: false
      # 確認は少し遅れて出るので待つ（出なければ先へ進む）
      - extendedWaitUntil:
          visible:
            id: 'dialog-message'
          timeout: 3000
          optional: true
      - runFlow:
          when:
            visible:
              id: 'dialog-message'
          commands:
            # 本文の前後に空白が入ることがあるので、前後は問わない
            - assertVisible: '.*編集モードに切り替えますか.*'
            - tapOn: 'Yes'
            - waitForAnimationToEnd:
                timeout: 3000
- extendedWaitUntil:
    visible:
      id: 'dataedit-input-cmt'
    timeout: 10000
# 編集画面を開いた直後のタップは取りこぼすことがある（シートの開くアニメーション中）
- waitForAnimationToEnd
- tapOn:
    id: 'dataedit-input-cmt'
- inputText: 'smoke'
- hideKeyboard
- tapOn:
    id: 'dataedit-save'
# 保存するとデータ一覧へ戻り、行が1つ増えている
- extendedWaitUntil:
    visible:
      id: data-row-${output.row}
    timeout: 10000

# 写真フィールドの「カメラ」で撮影して保存する（Android実機・エミュレーター用）。
# 0.6.0〜0.6.7で保存されなくなった経路。カメラアプリの操作は機種で違うため、
# エミュレーターのカメラは要素で、Pixelの標準カメラは位置で、シャッターと確定を指定している。
appId: jp.co.ecoris.ecorismap
env:
  LAYER_NAME: 'ポイント.*'
---
- launchApp:
    permissions:
      all: allow
- runFlow: ../common/open-point-layer.yaml
# いまある記録の数（＝これから作る記録の行番号）を数える。03は末尾のレコードを検証して消す
- runFlow: ../common/count-rows.yaml
- tapOn:
    id: 'data-add'
- extendedWaitUntil:
    visible:
      id: 'dataedit-photo-camera'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'dataedit-photo-camera'
- waitForAnimationToEnd:
    timeout: 5000
# エミュレーターのカメラ（com.android.camera2）: シャッターと「完了」を要素で指定する
- runFlow:
    when:
      visible:
        id: 'com.android.camera2:id/shutter_button'
    commands:
      - tapOn:
          id: 'com.android.camera2:id/shutter_button'
      - extendedWaitUntil:
          visible:
            id: 'com.android.camera2:id/done_button'
          timeout: 15000
      - tapOn:
          id: 'com.android.camera2:id/done_button'
# Pixelの標準カメラ: シャッターと確定（チェックマーク）を位置で指定する。
# エミュレーターのカメラで撮り終えていれば、編集画面に戻っているので何もしない
- runFlow:
    when:
      notVisible:
        id: 'dataedit-photo-camera'
    commands:
      - tapOn:
          point: '50%,75%'
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn:
          point: '50%,75%'
- extendedWaitUntil:
    visible:
      id: 'dataedit-photo-thumb-0'
    timeout: 30000
# 「アクティビティを保持しない」がONのときは、復帰処理が自動で保存するので保存ボタンは無効のまま
- runFlow:
    when:
      visible:
        id: 'dataedit-save'
        enabled: true
    commands:
      - tapOn:
          id: 'dataedit-save'
      - extendedWaitUntil:
          visible:
            id: data-row-${output.row}
          timeout: 10000

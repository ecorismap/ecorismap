# アプリを起動し直して、保存した写真が原画のまま開けることを確かめ、テスト用レコードを削除する。
# 01または02の後に実行する。iOSでは、このフローの前にアプリを入れ直すことで
# 「データコンテナが変わっても原画を参照できるか」（photoUriRebase）も確かめられる。
appId: jp.co.ecoris.ecorismap
env:
  LAYER_NAME: 'ポイント.*'
---
- stopApp
- launchApp
- runFlow: ../common/open-point-layer.yaml
# 01・02が作ったのは末尾のレコード
- runFlow: ../common/count-rows.yaml
- evalScript: ${output.last = output.row - 1}
- tapOn:
    id: data-row-${output.last}
- extendedWaitUntil:
    visible:
      id: 'dataedit-photo-thumb-0'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'dataedit-photo-thumb-0'
- extendedWaitUntil:
    visible:
      id: 'photo-view-close'
    timeout: 10000
# ダウンロードボタンは実ファイルが見つからないとき（サムネイル代用）だけ出る
- assertNotVisible:
    id: 'photo-view-download'
- takeScreenshot: photo-view
- tapOn:
    id: 'photo-view-close'
- tapOn:
    id: 'dataedit-delete'
- tapOn: 'Yes'
- extendedWaitUntil:
    visible:
      id: 'data-add'
    timeout: 10000
- assertNotVisible:
    id: data-row-${output.last}

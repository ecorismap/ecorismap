name: Android CI and Deploy
# 配信が走るのはmain・hotfix・releaseだけにする（作業ブランチのpushのたびに
# テスターの手元が未完成の版に入れ替わってしまうため）。
# 配信先はブランチで分かれる: main→クローズドテスト、hotfix/release→内部テスト。
# 任意のブランチ・任意のトラックへ送りたいときはworkflow_dispatchで手動実行する
on:
  push:
    branches:
      - main
      - 'hotfix/**'
      - 'release/**'
  workflow_dispatch:
    inputs:
      track:
        description: '配信先トラック（auto=ブランチで決定: main→alpha / その他→internal）'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - internal
          - alpha
          - beta
jobs:
  build-and-deploy:
    name: Build and Deploy Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "yarn"
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: gradle
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: yarn install
      - name: Create local.properties
        run: |
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY_ANDROID }}" > android/local.properties
          echo "TRANSISTORSOFT_LICENSE_KEY=\"${{ secrets.TRANSISTORSOFT_LICENSE_KEY }}\"" >> android/local.properties
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo $GOOGLE_SERVICES_JSON > android/app/google-services.json
      - name: Create APIKeys.ts
        env:
          APIKEYS_TS_BASE64: ${{ secrets.APIKEYS_TS_BASE64 }}
        run: |
          if [ -n "$APIKEYS_TS_BASE64" ]; then
            echo "$APIKEYS_TS_BASE64" | base64 --decode > src/constants/APIKeys.ts
          else
            echo "APIKEYS_TS_BASE64 secret is not set; falling back to template (Google Drive連携は無効になります)"
            cp template/APIKeys.ts src/constants/APIKeys.ts
          fi
      - name: Download and integrate react-native-gdalwarp
        run: |
          curl -L -o react-native-gdalwarp.zip https://github.com/tmizu23/build_gdal_android_ios/releases/download/v0.0.2/react-native-gdalwarp.zip
          unzip react-native-gdalwarp.zip
          mkdir -p modules
          cp -r react-native-gdalwarp modules/
      - name: Setup Android keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
      - name: Get and increment version code
        run: |
          # versionCodeはワークフローの実行番号から決める。
          # 以前は`git rev-list --count HEAD`（コミット数）だったが、これはブランチごとに
          # 値が変わる。リリースタグから切ったhotfixブランチはmainよりコミット数が少ないため、
          # mainのビルドが消費した番号より小さくなり、Playに「使用済み」と弾かれていた。
          # 実行番号はリポジトリ全体で単調増加し、どのブランチから流しても衝突しない。
          # オフセットは、コミット数方式で消費済みの番号（2855まで）を確実に超えるための下駄。
          # 注意: ワークフローファイル名を変えると実行番号が1に戻るので、その場合は
          # オフセットを上げ直すこと
          VERSION_CODE_OFFSET=3000
          NEW_VERSION=$((VERSION_CODE_OFFSET + GITHUB_RUN_NUMBER))

          echo "Run number: $GITHUB_RUN_NUMBER"
          echo "New version code: $NEW_VERSION"

          # Set as environment variable
          echo "VERSION_CODE=$NEW_VERSION" >> $GITHUB_ENV

          # Create whatsnew files with the build number
          mkdir -p whatsnew
          echo "Build $NEW_VERSION" > whatsnew/whatsnew-ja-JP
          echo "Build $NEW_VERSION" > whatsnew/whatsnew-en-US
      - name: Update AppConstants with build number
        run: |
          # デバッグ情報を追加
          echo "Current VERSION_CODE: $VERSION_CODE"
          echo "Current NEW_VERSION: $NEW_VERSION"

          # 現在のVERSION行を確認
          echo "Before update:"
          grep "export const VERSION" src/constants/AppConstants.tsx

          # sedコマンドを修正（環境変数を正しく使用）
          sed -i "s/export const VERSION = 'Version \([^']*\)';/export const VERSION = 'Version \1 (Build ${VERSION_CODE})';/" src/constants/AppConstants.tsx

          # 更新後の確認
          echo "After update:"
          grep "export const VERSION" src/constants/AppConstants.tsx
      - name: Build Release
        env:
          STORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: cd android && ./gradlew bundleRelease
      - name: Determine Play track
        run: |
          # 配信先はブランチで決める。開発中の版と、出荷済みへの修正とで
          # テスターの手元が入れ替わらないよう、トラックを分ける:
          # - main（次期バージョンの開発）→ クローズドテスト（alpha）
          # - hotfix/**（出荷済みへの修正）→ 内部テスト（internal）
          # - release/**（リリース前の仕上げ）→ 内部テスト（最終確認用）
          # 手動実行（workflow_dispatch）で指定があればそちらを優先する
          TRACK_INPUT="${{ github.event.inputs.track }}"
          if [ -n "$TRACK_INPUT" ] && [ "$TRACK_INPUT" != "auto" ]; then
            TRACK="$TRACK_INPUT"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            TRACK="alpha"
          else
            TRACK="internal"
          fi
          echo "PLAY_TRACK=$TRACK" >> $GITHUB_ENV
          echo "Branch: $GITHUB_REF_NAME / Play track: $TRACK"
      - name: Setup Google Play Config
        run: |
          echo '${{ secrets.PLAY_STORE_CONFIG_JSON }}' > play-store-config.json
      - name: Deploy to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: play-store-config.json
          packageName: jp.co.ecoris.ecorismap
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          track: ${{ env.PLAY_TRACK }}
          status: completed
          whatsNewDirectory: whatsnew

name: iOS Build and Upload
# ビルドが走るのはmainとhotfixだけにする（作業ブランチのpushのたびにTestFlightへ
# 上がると、審査待ちのビルドが積み上がり、CI時間も無駄になる）。
# 任意のブランチを試したいときはworkflow_dispatchで手動実行する
on:
  push:
    branches:
      - main
      - 'hotfix/**'
      - 'release/**'
  workflow_dispatch:
    inputs:
      upload:
        description: 'App Store Connect（TestFlight）へアップロードする'
        type: boolean
        default: true
jobs:
  build-and-upload:
    name: Build and Upload to App Store
    runs-on: macos-15
    # キャッシュなしでも60分ほどで終わる。署名待ちなどで止まったとき、既定の6時間まで走り続けないようにする
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ランナー既定のXcode 16（Swift 6.1）ではExpo SDK 56のパッケージ（Swift tools 6.2）を解決できない
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'yarn'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create Maps.plist
        run: |
          mkdir -p ios/ecorismap/Supporting
          cat << EOF > ios/ecorismap/Supporting/Maps.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>APIKey</key>
            <string>${{ secrets.MAPS_API_KEY_IOS }}</string>
          </dict>
          </plist>
          EOF

      - name: Create GoogleService-Info.plist
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > ios/ecorismap/GoogleService-Info.plist

      # 位置情報ライブラリ（react-native-background-geolocation）のiOS用ライセンス。
      # Xcodeのビルドフェーズ「[TS] Inject Background Geolocation License」が、このファイルの中身を
      # Info.plist の TSLocationManagerLicense へ入れる。無いままでもビルドは通ってしまい、
      # 起動時に「TSLocationManager LICENSE VALIDATION FAILURE」が出る版が配信されるので、無ければ止める
      - name: Create TSLicense.txt
        env:
          TS_LICENSE_IOS: ${{ secrets.TRANSISTORSOFT_LICENSE_KEY_IOS }}
        run: |
          if [ -z "$TS_LICENSE_IOS" ]; then
            echo "::error::TRANSISTORSOFT_LICENSE_KEY_IOS secret is not set (keys/transistorsoft-license-key-ios)"
            exit 1
          fi
          printf '%s\n' "$TS_LICENSE_IOS" > ios/ecorismap/Supporting/TSLicense.txt

      - name: Create APIKeys.ts
        env:
          APIKEYS_TS_BASE64: ${{ secrets.APIKEYS_TS_BASE64 }}
        run: |
          if [ -n "$APIKEYS_TS_BASE64" ]; then
            echo "$APIKEYS_TS_BASE64" | base64 --decode > src/constants/APIKeys.ts
          else
            echo "APIKEYS_TS_BASE64 secret is not set; falling back to template (Google Drive連携は無効になります)"
            cp template/APIKeys.ts src/constants/APIKeys.ts
          fi

      - name: Create ExportOptions.plist
        run: |
          echo '${{ secrets.EXPORT_OPTIONS }}' > ExportOptions.plist

      - name: Setup Certificate and Provisioning Profile
        run: |
          # Create directories
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          # Decode and install certificate (.p12)
          echo "${{ secrets.IOS_CERTIFICATE_BASE64 }}" | base64 --decode > certificate.p12
          security create-keychain -p temp_pass build.keychain
          security default-keychain -s build.keychain
          # 作ったキーチェーンは既定で数分後に自動でロックされる。コンパイルに数十分かかった後の署名で
          # 応答待ちのまま止まらないよう、ロックまでの時間をジョブの制限時間より長くしておく
          security set-keychain-settings -t 21600 -u build.keychain
          security unlock-keychain -p temp_pass build.keychain
          security import certificate.p12 -k build.keychain -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp_pass build.keychain

          # Decode and install provisioning profile
          echo "${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/ecorismap.mobileprovision

      - name: Download and integrate react-native-gdalwarp
        run: |
          curl -L -o react-native-gdalwarp.zip https://github.com/tmizu23/build_gdal_android_ios/releases/download/v0.0.1/react-native-gdalwarp.zip
          unzip react-native-gdalwarp.zip
          mkdir -p modules
          cp -r react-native-gdalwarp modules/

      - name: Install dependencies
        run: yarn install

      # ここから下はビルド時間の短縮用。React Native本体をソースからビルドしているため
      # （Podfileの RCT_USE_PREBUILT_RNCORE=0）、C/C++/ObjCのコンパイルが時間の大半を占める。
      # ccacheでコンパイル結果を持ち越し、変わっていないファイルは再コンパイルしない
      - name: Install ccache
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ccache
          # 置き場所は CCACHE_DIR で決める（このジョブの各ステップ用。コンパイル時の分はラッパーへ書き込む）
          mkdir -p "$HOME/ccache-store"
          echo "CCACHE_DIR=$HOME/ccache-store" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV

      # キャッシュは上書きできないので、キーに実行IDを入れて毎回保存し、直近のものを復元する
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/ccache-store
          key: ios-ccache-${{ github.run_id }}
          restore-keys: |
            ios-ccache-

      # Podsは依存が1つでも変わったら作り直す（キーが完全に一致したときだけ復元する）。
      # patches/ はnode_modules内のネイティブコードを書き換えるのでキーに含める
      - name: Restore Pods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ios-pods-${{ hashFiles('ios/Podfile', 'ios/Podfile.lock', 'ios/Podfile.properties.json', 'yarn.lock', 'patches/**') }}

      - name: Install CocoaPods
        env:
          # React Nativeのpost installが、Pods・アプリ双方のコンパイラをccache経由に切り替える
          USE_CCACHE: '1'
        run: |
          cd ios && pod install
          cd ..
          # React Nativeのラッパーは `exec $CCACHE_BINARY clang` と書かれているが、Xcodeはビルド設定や環境変数を
          # コンパイルの実行時には渡さない。そのままだとccacheを素通りして素のclangが動く。また、ラッパーが
          # 専用の設定ファイルを指定するので、システムの設定ファイルも読まれない。
          # ccacheの実体のパスと、キャッシュの置き場所・上限を、ラッパーへ直接書き込む
          CCACHE_BIN="$(command -v ccache)"
          for f in ccache-clang.sh ccache-clang++.sh; do
            sed -i '' "s|exec \$CCACHE_BINARY |export CCACHE_DIR=$CCACHE_DIR CCACHE_MAXSIZE=$CCACHE_MAXSIZE; exec $CCACHE_BIN |" "node_modules/react-native/scripts/xcode/$f"
            tail -1 "node_modules/react-native/scripts/xcode/$f"
          done
          ccache --zero-stats
          # ラッパー単体で同じファイルを2回コンパイルし、2回目がキャッシュから返ることを確かめる
          # （Xcodeと同じく環境変数を渡さない）。効いていなければここで止める
          mkdir -p "$RUNNER_TEMP/cctest" && cd "$RUNNER_TEMP/cctest"
          printf 'int f(int a){return a+1;}\n' > t.c
          WRAP="$GITHUB_WORKSPACE/node_modules/react-native/scripts/xcode/ccache-clang.sh"
          for i in 1 2; do env -i PATH="$(dirname "$(xcrun -f clang)"):/usr/bin:/bin" "$WRAP" -x c -c t.c -o "t$i.o"; done
          ccache --show-stats | grep -E "Hits|Misses"
          ccache --show-stats | grep -E "^ *Hits: +[1-9]" || { echo "ccacheが働いていません"; exit 1; }
          ccache --zero-stats

      - name: Set build number
        run: |
          # App Store Connectは同一バージョンでのビルド番号重複を拒否する。
          # 以前はコミット数で採番していたが、これはブランチごとに値が変わるため、
          # リリースタグから切ったhotfixブランチではmainより小さい番号になってしまう。
          # 実行番号はリポジトリ全体で単調増加し、どのブランチから流しても衝突しない
          # （pbxprojの値はビルド時に上書きするだけで、ファイルは変更しない）。
          # 注意: ワークフローファイル名を変えると実行番号が1に戻るので、
          # その場合はオフセットを上げ直すこと
          BUILD_NUMBER_OFFSET=3000
          BUILD_NUMBER=$((BUILD_NUMBER_OFFSET + GITHUB_RUN_NUMBER))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "Run number: $GITHUB_RUN_NUMBER / build number: $BUILD_NUMBER"

      - name: Update AppConstants with build number
        run: |
          sed -i '' "s/export const VERSION = 'Version \([^']*\)';/export const VERSION = 'Version \1 (Build ${BUILD_NUMBER})';/" src/constants/AppConstants.tsx
          grep "export const VERSION" src/constants/AppConstants.tsx

      - name: Archive Project
        env:
          NODE_BINARY: $(which node)
          # 手動実行で upload を外したときは、署名せずにビルドだけ確かめる（証明書の期限に左右されない）
          SKIP_SIGNING: ${{ github.event_name == 'workflow_dispatch' && !inputs.upload }}
        run: |
          if [ "$SKIP_SIGNING" = "true" ]; then
            xcodebuild archive -workspace ios/ecorismap.xcworkspace \
                               -scheme ecorismap \
                               -sdk iphoneos \
                               -configuration Release \
                               -archivePath ecorismap.xcarchive \
                               CURRENT_PROJECT_VERSION=${BUILD_NUMBER} \
                               COMPILER_INDEX_STORE_ENABLE=NO \
                               CODE_SIGNING_ALLOWED=NO
          else
            # 署名の設定はアプリのターゲットにだけ入れる。xcodebuild の引数で渡すと Pods の各ターゲットにも掛かり、
            # 「does not support provisioning profiles」で失敗する
            PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< $(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/ecorismap.mobileprovision))"
            sed -i '' \
              -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/' \
              -e 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "Apple Distribution";/' \
              -e 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";/' \
              -e "s/PROVISIONING_PROFILE_SPECIFIER = \"\";/PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";/" \
              ios/ecorismap.xcodeproj/project.pbxproj
            grep -c 'CODE_SIGN_STYLE = Manual;' ios/ecorismap.xcodeproj/project.pbxproj
            xcodebuild archive -workspace ios/ecorismap.xcworkspace \
                               -scheme ecorismap \
                               -sdk iphoneos \
                               -configuration Release \
                               -archivePath ecorismap.xcarchive \
                               CURRENT_PROJECT_VERSION=${BUILD_NUMBER} \
                               COMPILER_INDEX_STORE_ENABLE=NO
          fi

      - name: Show ccache stats
        if: always()
        run: |
          ccache --show-stats --verbose || true
          du -sh "$HOME/ccache-store" || true

      - name: Export IPA
        if: github.event_name != 'workflow_dispatch' || inputs.upload
        run: |
          # 書き出しでも、アーカイブの署名に使ったプロファイルを名指しする。ExportOptions.plist（Secrets）側の
          # プロファイル名が入れ直したプロファイルとずれていると「requires a provisioning profile with the
          # App Attest and Push Notifications features」で失敗するので、入れたプロファイルから毎回書き込む
          PROFILE_PLIST="$(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/ecorismap.mobileprovision)"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$PROFILE_PLIST")"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' /dev/stdin <<< "$PROFILE_PLIST")"
          BUNDLE_ID="${APP_ID#*.}"
          /usr/libexec/PlistBuddy -c 'Delete :provisioningProfiles' ExportOptions.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:${BUNDLE_ID} string ${PROFILE_NAME}" ExportOptions.plist
          /usr/libexec/PlistBuddy -c 'Delete :signingStyle' ExportOptions.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' ExportOptions.plist
          echo "export: ${BUNDLE_ID} -> ${PROFILE_NAME}"
          xcodebuild -exportArchive \
                     -archivePath ecorismap.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath app.ipa

      - name: Upload IPA to App Store Connect
        # 手動実行で upload を外したときは、ビルドの確認だけして上げない
        if: github.event_name != 'workflow_dispatch' || inputs.upload
        run: |
          xcrun altool --upload-app -f app.ipa/ecorismap.ipa \
                       -u ${{ secrets.APPLE_ID }} \
                       -p ${{ secrets.APP_SPECIFIC_PASSWORD }} \
                       --type ios
